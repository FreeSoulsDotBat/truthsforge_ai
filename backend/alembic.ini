# Alembic configuration for the Truth's Forge backend.
#
# ADR-013 adota Alembic como ferramenta canonica de migracoes. As migracoes
# vivem em ``backend/migrations/versions/`` e sao numeradas seguindo as ondas
# da refatoracao 3D chat-first:
#
#   001_initial_baseline             — espelha o estado atual produzido por
#                                      ``PostgresStore.init_schema()``.
#   002_chats_title_not_null         — Onda 2 (titulo obrigatorio, ADR-014).
#   003_chats_modeling_fields        — Onda 2 (is_modeling_3d, modeling_stage,
#                                      modeling_software_preference,
#                                      modeling_plan_id).
#   004_modeling_plans_kind          — indice em payload->>'kind' para queries
#                                      de planos primary/edit (Onda 1.4).
#   005_drop_legacy_modes            — pos-Onda-3, drop opcional dos campos
#                                      ``mode`` e ``approval_required`` no
#                                      payload do plano (ADR-013).
#
# A URL do banco e resolvida em ``migrations/env.py`` a partir de
# ``app.core.config.settings.database_url``; este arquivo apenas aponta para
# o diretorio dos scripts.

[alembic]
script_location = migrations
# Mantemos a URL vazia aqui — o env.py preenche em tempo de execucao.
sqlalchemy.url =

# Formato dos nomes de revisao: <slug>.py (sem timestamp embutido) porque
# numeramos manualmente as migracoes alinhadas com as ondas da refator.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
