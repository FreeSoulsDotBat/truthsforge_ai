[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truths-forge-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Truth's Forge AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
  "psycopg[binary]>=3.2.0",
  "qdrant-client>=1.10.0",
  "redis>=5.0.0",
  "langchain>=0.2.0",
  "langgraph>=0.2.0",
  "sentence-transformers>=3.0.0",
  "pypdf>=5.0.0",
  "pillow>=10.0.0",
  "pytesseract>=0.3.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
